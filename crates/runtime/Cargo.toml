[package]
name = "cadence-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded event transport, worker pool, effect execution, clocks, crossterm ingress, terminal lifecycle."

[package.metadata.tauten]
tier = "edge"

[lints]
workspace = true

[features]
# Test-only fault port (#51): CADENCE_FAULT_SLOW_SAVE="SEQ:MS" makes the
# writer wait MS milliseconds before applying checkpoint sequence SEQ, so a
# PTY run can show a slow save pausing and resuming practice. Never enabled
# in release builds.
test-faults = []

[dependencies]
cadence-core.workspace = true
cadence-engine.workspace = true
cadence-data.workspace = true
crossterm.workspace = true
ratatui.workspace = true
signal-hook.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
