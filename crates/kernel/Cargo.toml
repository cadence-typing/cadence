# Stated locally, not inherited: the proof gate translates this crate in a
# shadow workspace that carries no `workspace.lints`.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dev-dependencies]
# Test-only: the gate translates the library alone (`--lib`).
serde_json = "1.0.145"
