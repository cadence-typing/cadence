[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/core",
    "crates/trainer",
    "crates/engine",
    "crates/data",
    "crates/tui",
    "crates/runtime",
    "crates/driver",
    "crates/app",
    "xtask",
]

[workspace.package]
version = "0.1.0-beta.3"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tknawara/cadence"
publish = false

[workspace.lints.rust]
warnings = "deny"
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_sign_loss = "deny"
integer_division = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"

[workspace.dependencies]
cadence-kernel = { path = "crates/kernel" }
cadence-core = { path = "crates/core" }
cadence-trainer = { path = "crates/trainer" }
cadence-engine = { path = "crates/engine" }
cadence-data = { path = "crates/data" }
cadence-tui = { path = "crates/tui" }
cadence-runtime = { path = "crates/runtime" }
cadence-driver = { path = "crates/driver" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rusqlite = { version = "0.41.0", features = ["bundled", "backup"] }
toml = "0.9.8"
toml_edit = "=0.22.27"
ratatui = "0.29.0"
unicode-width = "=0.2.0"
crossterm = "0.29.0"
proptest = "1.8.0"
sha2 = "0.10.9"
rand = "0.9.2"
rand_chacha = "0.9.0"
tempfile = "=3.27.0"
signal-hook = "=0.3.18"
# Purpose: the local UTC offset at session start (#52, local-calendar days).
# Default features off; `clock` reads TZ and /etc/localtime in pure Rust.
# The local UTC offset at session start (replaces chrono, unmaintained:
# RUSTSEC-2026-0543): the system time zone only, from TZ or /etc/localtime.
jiff = { version = "0.2.46", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = "symbols"
