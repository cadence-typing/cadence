# The cross-session feedback loop (#40): observe, checkpoint, finish or kill,
# replay the durable rows through the review ladder, plan the due words,
# serve them. Mutant `drop-refused-miss` is the issue's
# `drop-miss-when-queue-full` generalised to every refusal of queue::admit.
# `reinforce-any-review-slot` is the alpha.5 behaviour, fixed by #43
# (`slots::substitute`, two-pass placement in Learning::open).
# Reachability probes (bounded, 3 days): promotion to rung 1, a kill, a
# reinforcement, a refused admission and a served due word are all reached;
# rung 2 needs four clean days and is outside the bound.
# Runtime tests per invariant: NoLostMiss -> a_full_reinforcement_queue...;
# NoFalsePromotion -> two_clean_days..., same_day_clean...;
# SameSessionNeverPromotes -> clean_before_due..., a_missed_word_returns_once...;
# EvidenceCountedOnce -> learning_round_trips..., lost_ack_retry...;
# QueueBounded -> a_queued_word_is_not_queued_twice, an_exhausted_word...;
# DueNotDisplaced -> due_reviews_keep_their_slots..., a_queued_word_already_in...;
# DueEventuallyServed -> due_missed_words_fill_review_slots_first.
[[model]]
module = "FeedbackLoop"
dir = "models"
config = "FeedbackLoop.cfg"
invariants = ["TypeOK", "NoLostMiss", "NoFalsePromotion", "SameSessionNeverPromotes", "EvidenceCountedOnce", "DueNotDisplaced", "QueueBounded"]
properties = ["DueEventuallyServed"]
# The liveness check over ~126k states takes about 90 s on one worker.
timeout_seconds = 300
status = "mapped"
production_symbols = [
  "cadence_kernel::review::ladder_step",
  "cadence_kernel::queue::admit",
  "cadence_kernel::slots::substitute",
  "cadence_engine::learning::{open, close, enqueue}",
  "cadence_trainer::learner::due_words",
  "cadence_data::learning_rows::save",
  "cadence_data::store::bootstrap",
]
runtime_tests = [
  "cadence-engine::a_full_reinforcement_queue_only_forgoes_the_repetition",
  "cadence-trainer::review::tests::two_clean_days_promote_once",
  "cadence-trainer::review::tests::same_day_clean_does_not_promote",
  "cadence-trainer::review::tests::clean_before_due_is_practice",
  "cadence-engine::a_missed_word_returns_once_in_a_later_review_slot",
  "cadence-data::tests::learning::learning_round_trips_and_history_returns_the_newest_window",
  "cadence-data::tests::checkpoints::lost_ack_retry_after_reopen_returns_exact_original_key",
  "cadence-engine::a_queued_word_is_not_queued_twice",
  "cadence-engine::an_exhausted_word_is_not_queued_again",
  "cadence-trainer::plan::tests::due_missed_words_fill_review_slots_first",
  "cadence-engine::due_reviews_keep_their_slots_and_a_broad_slot_is_used",
  "cadence-engine::a_queued_word_already_in_the_exercise_waits_for_the_next_one",
]

[[model.mutant]]
config = "FeedbackLoop-drop-refused-miss.cfg"
violates = "NoLostMiss"

[[model.mutant]]
config = "FeedbackLoop-promote-same-day.cfg"
violates = "NoFalsePromotion"

[[model.mutant]]
config = "FeedbackLoop-closing-review-promotes.cfg"
violates = "SameSessionNeverPromotes"

[[model.mutant]]
config = "FeedbackLoop-append-checkpoints.cfg"
violates = "EvidenceCountedOnce"

[[model.mutant]]
config = "FeedbackLoop-reinforce-any-review-slot.cfg"
violates = "DueNotDisplaced"

[[model.mutant]]
config = "FeedbackLoop-admit-duplicate.cfg"
violates = "QueueBounded"

[[model.mutant]]
config = "FeedbackLoop-starve-due.cfg"
violates = "DueEventuallyServed"

# Headless request admission (VP-05, #67): ordered stream, bounded cache
# with FIFO eviction, repeats and conflicting repeats. The decisions are the
# proved cadence_kernel::request::{admit, evict}, called by the driver's
# stream and response cache (#68).
[[model]]
module = "RequestCache"
dir = "models"
config = "RequestCache.cfg"
invariants = ["TypeOK", "AtMostOnceApply", "ConflictNeverMutates", "ExpiredNeverMutates", "CacheBounded"]
status = "mapped"
production_symbols = [
  "cadence_kernel::request::admit",
  "cadence_kernel::request::evict",
  "cadence_driver::stream::{admit}",
  "cadence_driver::protocol::{handle}",
]
runtime_tests = [
  "cadence-driver::repeats_replay_conflict_or_expire",
  "cadence-driver::hello_comes_first",
  "cadence-driver::each_rejection_class_has_its_code_and_mutates_nothing",
]

[[model.mutant]]
config = "RequestCache-replay-reapplies.cfg"
violates = "AtMostOnceApply"

[[model.mutant]]
config = "RequestCache-conflict-applies.cfg"
violates = "ConflictNeverMutates"

[[model.mutant]]
config = "RequestCache-evicted-reexecutes.cfg"
violates = "ExpiredNeverMutates"

# Headless barriers (VP-04, #71): jobs in causal groups, children registered
# when a parent's result is consumed, a durable scope over the checkpoint
# watermark, later unrelated work. The decisions are the proved
# cadence_kernel::barrier::{causal, durable}; the engine assigns groups.
[[model]]
module = "HeadlessBarrier"
dir = "models"
config = "HeadlessBarrier.cfg"
invariants = ["TypeOK", "NoEarlyReturn", "ChildBeforeDrain", "DurableCoversWatermark", "LaterWorkExcluded"]
status = "mapped"
production_symbols = [
  "cadence_kernel::barrier::causal",
  "cadence_kernel::barrier::durable",
  "cadence_engine::storage::{dispatch_checkpoint, save_result}",
  "cadence_driver::headless::{barrier, deliver, absorb}",
]
runtime_tests = [
  "cadence::a_causal_barrier_waits_for_the_follow_up",
  "cadence::a_durable_barrier_covers_its_watermark_only",
]

[[model.mutant]]
config = "HeadlessBarrier-early-return.cfg"
violates = "NoEarlyReturn"

[[model.mutant]]
config = "HeadlessBarrier-child-after-drain.cfg"
violates = "ChildBeforeDrain"

[[model.mutant]]
config = "HeadlessBarrier-ack-below-watermark.cfg"
violates = "DurableCoversWatermark"

