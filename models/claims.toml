# Living TLA+ model registry (RFC 2026-11-26-formal-gates-and-production-mapping, #28).
#
# `tools/tlc_gate.py` runs every model listed here: the positive `config`
# must find no error, and each `[[model.mutant]]` must fail on exactly the
# invariant it names. Run `tools/tlc_gate.py --update` after editing this
# file; it rewrites `models/claims.json` (the committed snapshot) and the
# protocol table in docs/TAUTEN.md, and refuses to record a model that lost
# an invariant, mutant, production symbol or runtime test, or dropped from
# `mapped`, unless an `[[amend]]` entry names the module with a reason.
#
# status = "mapped": the model describes shipped code. It needs
#   `production_symbols` (resolved against the workspace by the gate),
#   `runtime_tests` ("<package>::<test path>", resolved with
#   `cargo test -- --list`) and at least one mutant. Badge: model-proved
#   (bounded), never `proved`.
# status = "design-probe": the model describes a design that production does
#   not implement yet; it still runs, is never shown as mapped, and names what
#   it is `blocked_on`.
#
# New living models go in `models/`. The three handover models stay in the
# frozen, manifest-pinned `formal/` directory and are run from there unchanged.

[[model]]
module = "DurableCheckpoint"
dir = "formal"
config = "DurableCheckpoint.cfg"
invariants = ["TypeOK", "AckIsDurable", "NoDoubleCredit"]
status = "design-probe"
blocked_on = "superseded for production by models/CheckpointSave.tla (#30); kept as the handover's design probe for crash and reopen"

[[model.mutant]]
config = "DurableCheckpoint-early-ack.cfg"
violates = "AckIsDurable"

[[model.mutant]]
config = "DurableCheckpoint-double-credit.cfg"
violates = "NoDoubleCredit"

[[model]]
module = "AsyncAdmission"
dir = "formal"
config = "AsyncAdmission.cfg"
invariants = ["TypeOK", "AcceptedFresh", "AtMostOnce"]
status = "design-probe"
blocked_on = "#75: no job registry with epoch/request tickets is shipped"

[[model.mutant]]
config = "AsyncAdmission-no-epoch.cfg"
violates = "AcceptedFresh"

[[model.mutant]]
config = "AsyncAdmission-no-pending.cfg"
violates = "AtMostOnce"

[[model]]
module = "CausalBarrier"
dir = "formal"
config = "CausalBarrier.cfg"
invariants = ["TypeOK", "NoEarlyReturn"]
status = "design-probe"
blocked_on = "#4: the headless driver and its barriers are not shipped"

[[model.mutant]]
config = "CausalBarrier-early-return.cfg"
violates = "NoEarlyReturn"

# The shipped save protocol (#30). Action-to-Rust mapping is in the module's
# comments; correspondence is by review plus the runtime tests below (one or
# more per invariant: AckIsDurable -> fabricating_ack, lost_ack; NoDoubleCredit
# -> duplicate_counts, stale_sequences; SingleFlight -> single_flight;
# CleanExitIsDurable -> clean_exit, dirty_tail; FailedTailIsNamed ->
# second_interrupt).
[[model]]
module = "CheckpointSave"
dir = "models"
config = "CheckpointSave.cfg"
invariants = ["TypeOK", "AckIsDurable", "NoDoubleCredit", "SingleFlight", "CleanExitIsDurable", "FailedTailIsNamed"]
status = "mapped"
production_symbols = [
  "cadence_engine::storage::{dispatch_checkpoint, save_result, retry_save, request_exit, watchdog}",
  "cadence_runtime::writer::SaveWorker",
  "cadence_data::store::ProgressStore::apply_checkpoint",
  "cadence_kernel::checkpoint::admit",
]
runtime_tests = [
  "cadence-engine::final_flush_timeout_exits_unsuccessfully_without_fabricating_ack",
  "cadence-data::tests::checkpoints::lost_ack_retry_after_reopen_returns_exact_original_key",
  "cadence-engine::repeated_typing_and_checkpoint_ack_do_not_duplicate_counts",
  "cadence-data::tests::checkpoints::tampering_conflicts_and_unrecorded_stale_sequences_never_regress",
  "cadence-engine::single_flight_holds_under_a_burst_of_exercise_completions",
  "cadence-engine::clean_exit_waits_for_the_final_acknowledgement",
  "cadence-engine::pending_checkpoint_retains_dirty_tail_and_retry_uses_fresh_full_key",
  "cadence-engine::explicit_second_interrupt_after_failure_is_unsuccessful_exit",
]

[[model.mutant]]
config = "CheckpointSave-two-in-flight.cfg"
violates = "SingleFlight"

[[model.mutant]]
config = "CheckpointSave-early-ack.cfg"
violates = "AckIsDurable"

[[model.mutant]]
config = "CheckpointSave-double-credit.cfg"
violates = "NoDoubleCredit"

[[model.mutant]]
config = "CheckpointSave-quit-before-ack.cfg"
violates = "CleanExitIsDurable"

# The session flow (#31). State changes follow the proved
# cadence_kernel::session::step; the model adds the clock, the phase window,
# the interlude grace and the guards the engine keeps around the table.
# Runtime tests per invariant: ClockStoppedUnlessRunning -> paused_controls;
# NoScoreOutsidePhase -> exact_boundary; InterludeGrace -> in_flight_key;
# EndEarlyIsUnfinished -> ending_early; PauseKeepsReason -> paste_and_focus.
[[model]]
module = "SessionFlow"
dir = "models"
config = "SessionFlow.cfg"
invariants = ["TypeOK", "ClockStoppedUnlessRunning", "NoScoreOutsidePhase", "InterludeGrace", "EndEarlyIsUnfinished", "PauseKeepsReason"]
status = "mapped"
production_symbols = [
  "cadence_kernel::session::step",
  "cadence_kernel::time::in_window",
  "cadence_engine::flow::{transition, pause_for, resume, end_early, interlude_settled}",
  "cadence_engine::practice::{advance_clock, advance_phase}",
]
runtime_tests = [
  "cadence-engine::pause_before_first_input_and_paused_controls_do_not_score",
  "cadence-engine::exact_boundary_key_is_not_scored",
  "cadence-engine::an_in_flight_key_cannot_skip_the_phase_complete_screen",
  "cadence-engine::ending_early_opens_the_review_and_saves_as_unfinished",
  "cadence-engine::paste_and_focus_loss_pause_without_invalidating",
]

[[model.mutant]]
config = "SessionFlow-score-while-paused.cfg"
violates = "ClockStoppedUnlessRunning"

[[model.mutant]]
config = "SessionFlow-deadline-inclusive.cfg"
violates = "NoScoreOutsidePhase"

[[model.mutant]]
config = "SessionFlow-enter-skips-interlude.cfg"
violates = "InterludeGrace"

[[model.mutant]]
config = "SessionFlow-early-end-completed.cfg"
violates = "EndEarlyIsUnfinished"
