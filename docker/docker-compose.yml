name: cadence-feedback

x-gate: &gate
  image: cadence-gate:0.1.0-alpha.1
  working_dir: /src
  user: "${CADENCE_UID:-1000}:${CADENCE_GID:-1000}"
  environment:
    CARGO_NET_OFFLINE: "true"
    CADENCE_DIST_DIR: /dist
    # Gate receipts (performance, #15): written, never committed.
    CADENCE_RECEIPTS_DIR: /evidence-out
    # Candidates and gate receipts (#93) live in the build cache.
    CADENCE_BUILD_DIR: /cache
  volumes:
    - ..:/src:ro
    - ../.cadence-build:/cache
    - ../dist:/dist
    - ../evidence-out:/evidence-out
  network_mode: none

services:
  prepare:
    <<: *gate
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: bridge
    environment:
      CARGO_NET_OFFLINE: "false"
      # /src is read-only: the vetting sources go to the build cache.
      CADENCE_CORPUS_SOURCES: /cache/corpus-sources
    # The RustSec database snapshot for the offline audit (#95) goes to the
    # build cache with the crates.
    command: [sh, -c, "cargo fetch --locked && cargo deny fetch db && python3 tools/corpus/fetch_vetting_sources.py"]

  quality:
    <<: *gate
    command: [cargo, run, --locked, -p, xtask, --, quality]
  test:
    <<: *gate
    command: [cargo, test, --locked, --workspace]
  headless:
    <<: *gate
    command: [cargo, run, --locked, -p, xtask, --, gate, headless]
  pty:
    <<: *gate
    command: [cargo, run, --locked, -p, xtask, --, gate, pty-linux]
  persistence:
    <<: *gate
    command: [cargo, run, --locked, -p, xtask, --, gate, persistence-linux]
  model:
    <<: *gate
    command: [cargo, run, --locked, -p, xtask, --, gate, model]
  prove:
    <<: *gate
    command: [cargo, run, --locked, -p, xtask, --, gate, prove]
  verify:
    <<: *gate
    command: [cargo, run, --locked, -p, xtask, --, gate, verify]
  corpus:
    <<: *gate
    command: [cargo, run, --locked, -p, xtask, --, gate, corpus]
  package:
    <<: *gate
    command: [cargo, run, --locked, -p, xtask, --, dist]
  app:
    <<: *gate
    stdin_open: true
    tty: true
    command: [cargo, run, --locked, -p, cadence, --, --profile-dir, /cache/preview-profile]
