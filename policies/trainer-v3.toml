policy_id = "trainer-v3"
scoring_version = 1
status = "learning-from-mistakes-hypothesis"

[session]
default_budget_seconds = 900
phase_order = ["warmup", "adaptive_words", "number_row", "numpad", "prose", "review"]
phase_seconds = [60, 300, 120, 180, 180, 60]
# Review includes a bounded results/reflection interval, not extra typing.
minimum_budget_seconds = 300
maximum_budget_seconds = 1800
phase_minimum_seconds = [20, 60, 30, 45, 60, 15]

[selection]
block_slots = 10
lane_order = ["target", "broad", "target", "review", "target", "target", "broad", "target", "review", "target"]
target_slots = 6
review_slots = 2
broad_slots = 2
maximum_word_occurrences_per_block = 1
maximum_consecutive_word_occurrences = 1
maximum_focus_owned_target_slots = 3
maximum_candidates_per_slot = 256

[statistics]
recent_occurrence_window = 128
minimum_observations_for_confident_label = 20
minimum_sessions_for_confident_label = 2
error_prior_alpha = 1
error_prior_beta = 19

[utility_weights_basis_points]
error = 5000
hesitation = 2500
relevance = 1500
uncertainty = 1000

[review]
interval_days = [1, 3, 7, 14, 30]
independent_clean_sessions_to_promote = 2
maximum_same_session_reinforcements = 1
admission_order = "fifo_when_first_due"

[pace]
desired_first_pass_basis_points = 9800
slow_down_below_basis_points = 9500
qualifying_blocks_to_raise = 3
minimum_sessions_to_raise = 2
minimum_first_attempt_positions_per_block = 100
maximum_raise_basis_points = 300
maximum_lower_basis_points = 500

[benchmark]
every_completed_sessions = 7
probe_seconds = 120
remaining_prose_seconds = 60
require_unseen_text = true
exclude_interrupted = true
exclude_synthetic = true

[learning]
# Plan 0003. All values are product hypotheses, evaluated empirically.
# Sessions of recorded evidence read at startup (covers the 30-day review
# rung for one session per day, plus slack).
history_sessions = 60
# Evidence weight halves every this many sessions back (recency bias).
half_life_sessions = 7
# Clean inter-key intervals longer than this are pauses for the learner
# model only; scores and active time still include them (rule 1).
hesitation_ceiling_milliseconds = 1500
# Focus skills (letter transitions/keys) chosen per plan, strongest first.
focus_skill_count = 6
# Decayed first attempts a skill needs before its error rate can focus it.
minimum_focus_attempts = 6
# A focus needs a real signal, not noise: posterior error at least this far
# above the lane's error rate, or a mean clean interval at least this much
# slower than the lane mean (2500 = 25% slower).
focus_minimum_error_excess_basis_points = 300
focus_minimum_hesitation_basis_points = 2500
# Policy v3 (deliberate practice in every phase, #46). Focus skills per
# group besides the letters above: number-row digits and digit pairs, and
# numpad digits, the decimal point and their pairs (L-01: never mixed).
row_focus_skill_count = 3
numpad_focus_skill_count = 3
# Of every 3 numeric entries, 2 carry a focus digit or pair (#5).
numeric_target_share = [2, 3]
# A target word recurs only after this many exercises (#58).
minimum_exercises_between_word_repeats = 4
# A missed numeric entry returns once, at least this many entries later (#59).
numeric_reinforcement_gap_entries = 2
# Target slots draw from bands up to this one (core|common); tail words are
# unvetted (corpus/NOTICE) and stay in the broad lane only.
target_maximum_band = "common"
# Relevance input per band for target candidates.
core_relevance_basis_points = 10000
common_relevance_basis_points = 6000
# A target word can appear at most this many times in one session.
maximum_target_word_occurrences_per_session = 3
# Due review words served per session (FIFO by due day).
maximum_due_reviews_per_session = 40
# Missed words waiting for same-session reinforcement.
reinforcement_queue_capacity = 8
# Prose passages typed within this many sessions are not re-served while
# unseen passages remain.
prose_no_repeat_sessions = 200
# Prose exercise length in units (one screenful of native 2x text).
prose_exercise_units = 160
# Planning headroom: prepared prose units per allocated second (≈ 3x a
# 100 WPM typist); unused passages are simply not served.
prose_units_per_second = 15
# One prepared word exercise per this many allocated seconds.
seconds_per_word_exercise = 5

[runtime]
maximum_queued_input_events = 1024
maximum_queued_input_bytes = 262144
maximum_outstanding_jobs = 8
maximum_completion_payload_bytes = 4194304
maximum_retained_completion_bytes = 33554432
maximum_input_events_per_turn = 64
owner_turn_budget_microseconds = 4000
maximum_extra_input_units = 128
maximum_headless_line_bytes = 1048576
headless_response_cache_entries = 1024
