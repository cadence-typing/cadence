# Proof claims for cadence-kernel (tauten proof tier). `cargo tauten proofs`
# runs the gate below and records one outcome per claim in
# proofs/claims.json: proved, drift, build-failed, audit-failed,
# mutant-survived or tool-missing. Each [[mutant]] is a textual change to the
# Rust source (it must match exactly once) that must break at least one of
# its claim's theorems.
version = 1

[gate]
# Run from the workspace root. proofs/run.sh checks for Docker and the
# pinned image, then runs proofs/gate.py in it.
command = ["sh", "proofs/run.sh"]
# Only translate: the authoritative check that kernel code stays inside what
# the toolchain translates.
extract = ["sh", "proofs/run.sh", "python3", "proofs/gate.py", "--extract-only"]
# The developer loop: every stage, but only the named mutants; never recorded.
try = ["sh", "proofs/run.sh", "python3", "proofs/gate.py", "--only-mutants"]
# Crate directories the gate translates with Charon/Aeneas.
crates = ["crates/kernel"]

# ---- first-attempt slots (crates/kernel/src/first.rs)

[[claim]]
crate = "cadence-kernel"
file = "crates/kernel/src/first.rs"
function = "first::settle"
lean = "cadence_kernel.first.settle"
theorems = [
  "Proofs.First.settle_spec",
  "Proofs.First.settle_write_once",
  "Proofs.First.mistake_stays_an_error",
  "Proofs.First.first_match_is_kept",
]
total = "Proofs.First.settle_spec"
mutants = ["settle-forgives-correction", "settle-overwrites-correct", "settle-open-always-correct"]

[[mutant]]
name = "settle-forgives-correction"
file = "crates/kernel/src/first.rs"
before = "        Slot::Incorrect => Slot::Incorrect,\n"
after = "        Slot::Incorrect => if matched { Slot::Correct } else { Slot::Incorrect },\n"

[[mutant]]
name = "settle-overwrites-correct"
file = "crates/kernel/src/first.rs"
before = "        Slot::Correct => Slot::Correct,\n"
after = "        Slot::Correct => if matched { Slot::Correct } else { Slot::Incorrect },\n"

[[mutant]]
name = "settle-open-always-correct"
file = "crates/kernel/src/first.rs"
before = "            if matched {\n                Slot::Correct\n            } else {\n                Slot::Incorrect\n            }\n"
after = "            if matched || !matched {\n                Slot::Correct\n            } else {\n                Slot::Incorrect\n            }\n"

[[claim]]
