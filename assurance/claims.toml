# The assurance manifest (V-02, V-05, #91): every handover claim id of the
# frozen `formal/claims.json`, bound to the Lean theorems that prove it
# (recorded `proved` in `proofs/claims.json`), the TLC models that check its
# interleavings (`mapped` in `models/claims.json`) and the runtime tests
# that exercise the production path ("<package>::<test path>", as
# `cargo test -- --list` prints them).
#
# `cargo xtask assurance` fails when an id has no entry, a theorem is not
# proved, a model is not mapped, a test does not exist, or a status claims
# more than its evidence; `--update` rewrites the table in docs/TAUTEN.md.
#
# status = "proved": the safety property holds for the production decision
#   or machine (every reachable state where the theorem says so); the named
#   models check the interleavings around it, bounded.
# status = "model-proved": the property is checked by TLC to a bound under
#   stated fairness; the theorems prove the parts that are not liveness.
# Lean stands in for Verus and TLAPS (docs/decisions/0009).

[[claim]]
id = "VP-01"
claim = "async admission"
lean = [
  "Proofs.Ticket.accept_iff_fresh",
  "Proofs.Ticket.at_most_once",
  "Proofs.Ticket.stale_error_never_replaces",
  "Proofs.Ticket.accepted_fresh",
]
models = ["WorkerResults"]
runtime_tests = [
  "cadence-engine::a_duplicate_result_applies_once",
  "cadence-engine::late_results_from_an_older_epoch_change_nothing",
]
status = "proved"
assumptions = [
  "The engine raises a job kind's epoch on restart and hands out increasing request ids (tested; Ticket.accepted_fresh assumes it as the world's rule).",
]

[[claim]]
id = "VP-02"
claim = "bounded completion retention"
lean = ["Proofs.Ticket.completion_retained"]
models = ["WorkerResults"]
runtime_tests = ["cadence-engine::a_storm_of_stale_results_leaves_the_table_bounded"]
status = "proved"
assumptions = [
  "Bounded storage is the job table's fixed slots (one per kind); the storm test measures it, the proof covers retention and at-most-once completion.",
]

[[claim]]
id = "VP-03"
claim = "durable checkpoint"
lean = [
  "Proofs.Checkpoint.admit_spec",
  "Proofs.Checkpoint.applied_sequence_never_reapplies",
  "Proofs.Progress.credit_once_spec",
  "Proofs.Save.single_flight",
  "Proofs.Save.ack_monotone",
  "Proofs.Save.failed_tail_named",
  "Proofs.Save.clean_exit_needs_final_ack",
  "Proofs.Chunks.admit_spec",
  "Proofs.Chunks.conflict_on_changed_payload",
]
models = ["CheckpointSave"]
runtime_tests = [
  "cadence-data::tests::checkpoints::lost_ack_retry_after_reopen_returns_exact_original_key",
  "cadence-data::tests::learning::retries_store_chunks_once_and_writes_stay_bounded",
  "cadence-engine::the_recorded_tape_replays_to_the_same_commands",
]
status = "proved"
assumptions = [
  "SQLite commits the checkpoint transaction atomically; that an acknowledgement is never observed before the commit (AckIsDurable) is checked by CheckpointSave.tla, bounded, not proved.",
  "The engine reports the save events where save.rs says (trusted; the tape and the session tests exercise it).",
]

