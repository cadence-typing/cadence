runtime_tests = [
  "cadence::a_causal_barrier_waits_for_the_follow_up",
  "cadence::a_durable_barrier_covers_its_watermark_only",
]
status = "proved"
assumptions = [
  "The driver counts the scope (children inherit their parent's causal group) as tested; the counts are the world's in Barrier.done_is_drained.",
]

